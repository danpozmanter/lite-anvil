[package]
name = "anvil-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared core library for Lite Anvil and Nano Anvil editors"

[features]
default = ["sdl"]
sdl = [
    "dep:sdl3-sys",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-foundation",
    "dep:objc2-quartz-core",
    "dep:objc2-io-surface",
]

[dependencies]
# Build SDL3 from vendored source, statically, as part of this crate's
# build graph. That way source builders on any distro (Nix, Arch, Debian,
# Gentoo, ...), as well as Homebrew Macs and stock Windows boxes, always
# end up with the exact SDL3 we expect — rather than whatever libSDL3
# the system happens to provide via pkg-config / vcpkg, which may have
# extra GPU / audio / joystick subsystems on by default.
#
# `sdl-lean-and-mean` and the `no-sdl-*` flags turn off subsystems the
# editor never touches (the SDL_GPU API, camera, joystick, haptic,
# sensor, HIDAPI, dialog, tray, power) so the resulting static library
# is smaller and avoids probing hardware it can't use.
#
# Note: sdl3-sys 0.6.3 does not yet expose Cargo features for SDL_OPENGL
# / SDL_VULKAN / SDL_WAYLAND, so those remain compiled in. Runtime hints
# set in `window::init` steer SDL toward X11 + software surfaces on
# Linux to keep actual GPU usage off.
#
# Prerequisite for source builders: cmake + a C compiler (both already
# required by other deps in most setups).
sdl3-sys = { version = "0.6.3", features = [
    "build-from-source-static",
    "sdl-lean-and-mean",
    "no-sdl-gpu",
    "no-sdl-camera",
    "no-sdl-joystick",
    "no-sdl-haptic",
    "no-sdl-hidapi",
    "no-sdl-sensor",
    "no-sdl-dialog",
    "no-sdl-tray",
    "no-sdl-power",
], optional = true }
fontdue = "0.9.3"
# Pinned below 0.23: the `bundled` feature in 0.20-0.22 compiles a lean
# FreeType from source (PNG/BZIP2/Brotli/HarfBuzz off, FreeType's built-in
# gzip in place of libz), which is exactly the self-contained static build
# this workspace wants on every platform. 0.23's `bundled` additionally
# compiles a vendored libpng whose `#include "zlib.h"` resolves through a
# dead relative include path, so it needs system zlib headers it cannot find
# on Windows MSVC and fails to build there.
freetype-sys = { version = "0.22.1", features = ["bundled"] }
notify = "8.2.0"
pcre2 = "0.2.11"
pulldown-cmark = { version = "0.12", default-features = false }
png = "0.18"
libc = "0.2.182"
bitflags = "2.11.0"
log = "0.4.29"
env_logger = "0.11.9"
thiserror = "2.0.18"
anyhow = "1.0.102"
parking_lot = "0.12.5"
crossbeam-channel = "0.5.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8"

# macOS shows the software frame through IOSurfaces set as a layer's
# contents (`renderer/layer.rs`), so SDL never builds its Metal renderer
# and window texture.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder", "objc2-core-foundation", "objc2-quartz-core"], optional = true }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"], optional = true }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation"], optional = true }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"], optional = true }

[build-dependencies]
cc = "1"

# Cocoa windows need the main thread, which libtest's harness does not give.
[[test]]
name = "macos_layer"
harness = false
required-features = ["sdl"]
